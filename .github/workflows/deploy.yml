name: Generate Marp PDF Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Convert all slides to PDF
        run: |
          mkdir -p slides/generated
          for f in markdown/seance*_slides.md; do
            name=$(basename "$f" .md)
            echo "→ $f"
            marp --pdf --allow-local-files "$f" \
              --theme markdown/esgi_theme.css \
              -o "slides/generated/${name}.pdf"
          done

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add slides/generated/*.pdf
          git diff --staged --quiet || git commit -m "chore: update generated PDF slides [skip ci]"
          git push
